#!/usr/bin/env optmux
# A taste of configuring popular tmux plugins from YAML instead of tmux.conf. Not exhaustive: see each plugin's
# README for its options, and optmux-defaults.yaml for what optmux sets up out of the box. Uncomment to try.
#
# Maintaining this by hand: it only needs to still load (tests/test_load_config.py checks it), and the commented
# options should match what the plugins document today (e.g., claritmux's "Customization" section).
session_name: example-full
start_directory: .

+optmux:
  # A plugin is a name (yours: user/repo) and its options. optmux installs it, and writes each option as
  # `set -g @option "value"`: `$VAR` expands, YAML booleans work, comments stay next to the setting.
  +plugins:
    # Options as a mapping, with a note of why next to each.
    tmux-plugins/tmux-resurrect:
      resurrect-strategy-vim: session
      resurrect-capture-pane-contents: true
      resurrect-dir: $OPTMUX_DIR/tmux/resurrect  # saved state per project, not one shared directory

    # Colors for the status line, from claritmux's own list. Uncomment one to change it.
    netj/claritmux:
      claritmux_status_hostname: 1
      #claritmux_color_bg: '#1e1e2e'
      #claritmux_color_active: '#a6e3a1'
      #claritmux_color_prefix: '#89dceb'
      #claritmux_color_host: '#585b70'

    # Or hand a plugin raw tmux config lines when an option needs more than a value.
    #catppuccin/tmux:
    #- set -g @catppuccin_flavor 'mocha'
    #- set -gF @claritmux_color_bg '#{@thm_bg}'

    # `false` turns off a plugin optmux enables by default.
    #Morantron/tmux-fingers: false

  # The same file holds your shortcuts: the key is yours, the `+` words say what it does.
  +shortcuts:
    C-M-b: gh browse .

windows:
  - window_name: shell
    panes:
      - ""
