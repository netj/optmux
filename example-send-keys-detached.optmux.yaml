#!/usr/bin/env -S uvx optmux
# send-keys + detached shortcuts.
# Note: for detached shortcuts, send-keys and command behave identically —
# raw send-keys cannot reliably target a background pane/window, so the
# command is run via $SHELL -euc heredoc (same as command type).
# Use send-keys here for shell expansion (aliases, $VARIABLE) or familiarity.
session_name: example-send-keys-detached
start_directory: .

optmux:
  shortcuts:

    # ── pane ──────────────────────────────────────────────────────────────────
    C-M-b:
      send-keys: gh browse .
      detached: true
    C-M-m:
      send-keys: uvx marimo edit
      detached: true

    # ── new_window ─────────────────────────────────────────────────────────────
    C-M-d:
      send-keys: |-
        hi=$(ps -A -o %cpu=,pid=,command= | sort -rn | awk '$1>50')
        if [ -n "$hi" ]; then echo "High CPU:"; echo "$hi"; exit 1
        else echo "CPU OK"
        fi
      new_window: true
      detached: true
    C-M-e:
      send-keys: ${VISUAL:-${EDITOR:-vim}} README.md
      new_window: true
      detached: true

windows:
  - window_name: shell
    panes:
      - ""
