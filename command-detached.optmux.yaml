#!/usr/bin/env -S uvx optmux
# command + detached shortcuts — always a background window, focus stays put.
# The current window is never touched (its layout and zoom survive), so
# new_window is implied; it only matters for non-detached shortcuts.
# remain: on-error (default) — close silently on exit 0, pause with prompt on failure.
# remain: false              — always close immediately.
# remain: true               — always pause before closing.
# A pause rings the bell (BEL), so tmux flags the background window for you.
session_name: command-detached
start_directory: .

optmux:
  shortcuts:

    # ── remain variants ────────────────────────────────────────────────────────
    C-M-b:
      command: gh browse .              # exits 0 → window closes silently
      detached: true
    C-M-m:
      command: uvx marimo edit          # Ctrl-C (exit 130) → hold open with prompt
      detached: true
    C-M-n:
      command: uvx marimo edit
      detached: true
      remain: false                     # always close, no hold
    C-M-y:
      command: uvx marimo edit
      detached: true
      remain: true                      # always hold open

    # ── explicit new_window (redundant with detached, but harmless) ────────────
    C-M-d:
      command: |-
        hi=$(ps -A -o %cpu=,pid=,command= | sort -rn | awk '$1>50')
        if [ -n "$hi" ]; then echo "High CPU:"; echo "$hi"; exit 1
        else echo "CPU OK"
        fi
      new_window: true                  # exit 0 → window closes; exit 1 → hold open
      detached: true
    C-M-e:
      command: ${VISUAL:-${EDITOR:-vim}} README.md
      new_window: true
      detached: true

windows:
  - window_name: shell
    panes:
      - ""
