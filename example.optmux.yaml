#!/usr/bin/env -S uvx optmux
session_name: example
start_directory: .

optmux:
  shortcuts:
    C-M-b: gh browse .
    C-M-m: uvx marimo edit
    C-M-d:
      command: |-
        hi=$(ps -A -o %cpu=,pid=,command= | sort -rn | awk '$1>50')
        if [ -n "$hi" ]; then echo "High CPU:"; echo "$hi"; exit 1
        else echo "CPU OK"
        fi
      new_window: true
    C-M-e:
      command: ${VISUAL:-${EDITOR:-vim}} README.md
      new_window: true
    E:
      command: ${VISUAL:-${EDITOR:-vim}} .
  tmux_config:
    project-settings: |
      set -g @claritmux_color_host 'cyan'
  menu:
    pane:
      - key: e
        title: Edit README
        command: ${VISUAL:-${EDITOR:-vim}} README.md
      - "*"
    window:
      - default: Kill
        title: Close Window
        key: q
      - "*"

windows:
  - window_name: editor
    panes:
      - vim .
  - window_name: shell
    panes:
      - ""
  - window_name: logs
    panes:
      - tail -f /var/log/system.log
