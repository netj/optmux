optmux:
  # tmux plugins (TPM): plugin -> tmux config lines for its options (empty for none).
  # A later layer's entry replaces the whole entry; `false` disables a plugin.
  plugins:
    tmux-plugins/tmux-sensible:      # hx limit, mouse, C-n/C-p over awkward n/p
    tmux-plugins/tmux-pain-control:  # move around panes with j and k, a bit like vim; resize panes like vim
    Morantron/tmux-fingers:          # prefix+F to highlight and copy URLs/paths/hashes/IPs
      fingers-skip-wizard: 1
    netj/tmux-yank:
    tmux-plugins/tmux-resurrect:
      resurrect-strategy-vim: session
      resurrect-capture-pane-contents: true
      # isolate saved state per optmux session, not shared ~/.local/share/tmux/resurrect
      resurrect-dir: $OPTMUX_DIR/tmux/resurrect
    #tmux-plugins/tmux-continuum:
    #  continuum-restore: true
    netj/claritmux:
      claritmux_status_workdir: 0
      claritmux_status_date: 0
      claritmux_status_time: 0
      claritmux_status_hostname: 1

  # Opinionated environment for commands run via `optmux-env` (as the shortcuts below do) and
  # everything they start; it wins over your own settings there, while your shells stay untouched.
  # All of env, git_config, and lazygit end up in $OPTMUX_DIR/env.sh.
  # `$VAR` expands; a null value unsets the variable.
  env:
    PAGER: less
    # --no-init --RAW-CONTROL-CHARS --ignore-case --LONG-PROMPT --HILITE-UNREAD --chop-long-lines --clear-screen --mouse
    LESS: -XRiMWSc --mouse
    # open clicked OSC 8 hyperlinks (delta's file:line and commit links) with optmux-open-url;
    # the leading ^P- tells less to run it without echoing the command or printing "link done"
    LESS_OSC8_OPEN_ANY: "\x10-optmux-open-url"

  # git config, passed through GIT_CONFIG_PARAMETERS (like `git -c`; delta reads that too) so it wins over ~/.gitconfig without touching it.
  # A pager whose command isn't installed (e.g., no delta) is skipped.
  git_config:
    core.pager: delta
    interactive.diffFilter: delta --color-only
    delta.navigate: true
    delta.line-numbers: true
    delta.hyperlinks: true
    delta.hyperlinks-file-link-format: file://{path}#L{line}
    # override git's default LESS=FRX: quit-if-one-screen conflicts with --mouse and clicking links
    delta.pager: less -+F
    diff.colorMoved: default

  # lazygit config, layered on top of your own lazygit config (deep-merged; lists replace).
  # A diffRenderer whose command isn't installed is skipped.
  lazygit:
    promptToReturnFromSubprocess: false
    git:
      diffRenderers:
      # clicking a line number opens it in your editor (lazygit-edit:// links)
      - colorArg: always
        command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format='lazygit-edit://{path}:{line}'
    customCommands:
    - key: <c-g>
      context: global
      description: Diff against the default branch (origin/HEAD, or origin/main)
      command: git diff "$(git rev-parse --abbrev-ref origin/HEAD 2>/dev/null || echo origin/main)"...
      output: terminal

  shortcuts:
    # Workflow
    C-M-c:
      command: WTCODE_TMUX_MODE=split-window wtcode
      new_window: true
      remain: false
      tip: wtcode
    C-M-f:
      command: ${VISUAL:-${EDITOR:-vim}} $(fzf || echo .)
      tip: find file to edit
    C-M-g:
      command: optmux-env lazygit
      tip: lazygit
    C-M-d:
      command: optmux-env git diff
      tip: clickable git diff (click a line number twice to edit)
    C-M-s:
      command: ""
      tip: shell in same dir
    C-M-w:
      command: optmux-gh-open
      detached: true
      new_window: true
      tip: open PR (or repo) on GitHub
    C-M-h:
      command: bash "$OPTMUX_DIR/tmux/tips.sh" --force
      new_window: true
      tip: tips (this screen)

    # Quick access (raw tmux actions)
    C-M-z:
      tmux: resize-pane -Z
      tip: quick toggle zoom
    "C-M-\\":
      tmux: select-pane -l \; resize-pane -Z
      tip: last pane + zoom
    C-M-o:
      tmux: select-pane -t :.- \; resize-pane -Z
      tip: prev pane + zoom

    # Reference (display-only, bound in tmux.conf or plugins)
    C-t C-t:
      tip: last window
    C-t C-c:
      tip: new window
    C-t C-d:
      tip: detach
    C-t C-o:
      tip: rotate panes forward
    C-t o:
      tip: rotate panes backward
    C-t n:
      tip: next window with bell
    C-t p:
      tip: prev window with bell
    C-t z:
      tip: toggle zoom
    "C-t `":
      tip: kill session (confirm)
    C-t R:
      tip: reload config
    C-t F:
      tip: fingers (copy URLs/paths/hashes)
    C-t h/j/k/l:
      tip: navigate panes
    C-t t:
      tip: send prefix to nested tmux
    C-t T:
      tip: swap prefix (nested tmux)

  menu:
    pane:
      - key: w
        title: New Window (C-t c)
        new_window: true
      - "*"
    window:
      - key: b
        title: "#{?monitor-bell,Disable,Enable} Bell Alert"
        tmux: if-shell -F "#{monitor-bell}" "set -w monitor-bell off" "set -w monitor-bell on"
      - key: q
        title: "#{?#{>:#{monitor-silence},0},Disable,Enable} Silence Alert"
        tmux: if-shell -F "#{>:#{monitor-silence},0}" "set -w monitor-silence 0" "set -w monitor-silence 15"
      - separator
      - "*"
