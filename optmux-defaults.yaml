+optmux:
  # tmux plugins (TPM): plugin -> tmux config lines for its options (empty for none).
  # A later layer's entry replaces the whole entry; `false` disables a plugin.
  +plugins:
    tmux-plugins/tmux-sensible:      # hx limit, mouse, C-n/C-p over awkward n/p
    tmux-plugins/tmux-pain-control:  # move around panes with j and k, a bit like vim; resize panes like vim
    Morantron/tmux-fingers:          # prefix+F to highlight and copy URLs/paths/hashes/IPs
      fingers-skip-wizard: 1
    netj/tmux-yank:
    tmux-plugins/tmux-resurrect:
      resurrect-strategy-vim: session
      resurrect-capture-pane-contents: true
      # isolate saved state per optmux session, not shared ~/.local/share/tmux/resurrect
      resurrect-dir: $OPTMUX_DIR/tmux/resurrect
    #tmux-plugins/tmux-continuum:
    #  continuum-restore: true
    netj/claritmux:
      claritmux_status_workdir: 0
      claritmux_status_date: 0
      claritmux_status_time: 0
      claritmux_status_hostname: 1

  # Opinionated environment for commands run via `optmux-env` (as the shortcuts below do, by absolute
  # path: your shell startup files may rebuild PATH, but $OPTMUX_DIR is always set) and
  # everything they start; it wins over your own settings there, while your shells stay untouched.
  # All of env, git_config, and lazygit end up in $OPTMUX_DIR/env.sh.
  # `$VAR` expands; a null value unsets the variable.
  +env:
    PAGER: less
    # --no-init --RAW-CONTROL-CHARS --ignore-case --LONG-PROMPT --HILITE-UNREAD --chop-long-lines --clear-screen --mouse
    LESS: -XRiMWSc --mouse
    # open clicked OSC 8 hyperlinks (delta's file:line and commit links) with optmux-open-url;
    # the leading ^P- tells less to run it without echoing the command or printing "link done"
    LESS_OSC8_OPEN_ANY: "\x10-optmux-open-url"

  # git config, passed through GIT_CONFIG_PARAMETERS (like `git -c`; delta reads that too) so it wins over ~/.gitconfig without touching it.
  # A pager whose command isn't installed (e.g., no delta) is skipped.
  +git_config:
    core.pager: delta
    interactive.diffFilter: delta --color-only
    delta.navigate: true
    delta.line-numbers: true
    delta.hyperlinks: true
    delta.hyperlinks-file-link-format: file://{path}#L{line}
    # override git's default LESS=FRX: quit-if-one-screen conflicts with --mouse and clicking links
    delta.pager: less -+F
    diff.colorMoved: default

  # lazygit config, layered on top of your own lazygit config (deep-merged; lists replace).
  # A diffRenderer whose command isn't installed is skipped.
  +lazygit:
    promptToReturnFromSubprocess: false
    git:
      diffRenderers:
      # clicking a line number opens it in your editor (lazygit-edit:// links)
      - colorArg: always
        command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format='lazygit-edit://{path}:{line}'
    customCommands:
    - key: <c-g>
      context: global
      description: Diff against the default branch (origin/HEAD, or origin/main)
      command: optmux-diff-base
      output: terminal

  # optmux Find's language server source (C-l): per language, the file extensions that mean it, and the servers
  # to try in order (the first one installed is used). A language is used when it has a few tracked files.
  # Override in your optmux.yaml: `servers` (replaces the list), `extensions`, `enabled: false`, or a one-server
  # shorthand `command:` (+ `install:`). `open_first_file: true` opens one file after start, for servers that
  # find their project from it. `install` (one command or a list of alternatives, the first whose installer is present is used) is offered in the list: Enter runs it.
  # How a row of optmux Find or eXtract says what it is: nerd (Nerd Font glyphs; boxes without the font), emoji
  # (works everywhere), text (letters), or none.
  +icons: nerd
  +find:
    # The selected row's file around its line, beside the list (C-/ toggles it; hidden on narrow screens).
    +preview: true
    # Files the file list (C-f) leaves out even though they are there: glob patterns matched against each name in a
    # path (`node_modules` skips the whole directory, `*.pyc` the files), in groups so you can target one: set
    # a group in your optmux.yaml to replace its list, `[]` (or null) to drop it, or add a group of your own.
    # (.git is always skipped.)
    +ignore_files:
      dependencies:
      - node_modules
      - .venv
      - venv
      - .tox
      - .gradle
      caches:
      - __pycache__
      - .mypy_cache
      - .pytest_cache
      - .ruff_cache
      - .cache
      - .DS_Store
      build:
      - target
      optmux:  # optmux's own state: its plugins, scripts, tags
      - "*.optmux.d"
    # Files the tags index (C-t, and the tags in C-o) leaves out, like ignore_files and with the same rules. ctags makes
    # a "symbol" of every key in a JSON file and of every generated binding, so a few big ones can mean hundreds of
    # thousands of rows and a list that takes minutes to load.
    +ignore_tags:
      data:
      - "*.json"
      - "*.jsonl"
      - "*.ndjson"
      - "*.csv"
      - "*.lock"
      generated:
      - generated
      - "*.min.js"
      - "*.min.css"
      - "*.map"
    # Spans eXtract (C-t X, in the spans filter) never lists: the chrome a coding tool draws all the time. Groups of
    # regular expressions matched against a whole span (case-insensitive), with the same rules as ignore_files: set a
    # group to replace its list, `[]` to drop it, or add a group of your own. Keep it dumb: add a line when something
    # keeps showing up, drop it when it stops. (A pattern ending in `:` is written `[:]`, or YAML reads a key.)
    +ignore_spans:
      claude_code_footer:
      - \W*(auto|plan|accept edits|bypass permissions) (mode )?on
      - .*\(shift\+tab to cycle\).*
      - .*esc to interrupt.*
      - \? for shortcuts
      - .*ctrl\+[a-z] to .*
      claude_code_commands:
      - /(add-dir|clear|compact|config|context|cost|effort|help|init|login|logout|mcp|model|permissions|resume|status|terminal-setup)
      claude_code_status:
      - \w+(ed|ing) for \d.*
      - \d+ tokens?
      - Not logged in.*
      - recap[:]
    +lsp:
      python:
        +extensions:
        - py
        - pyi
        +servers:
        - +command: basedpyright-langserver --stdio
          +install:
          - brew install basedpyright
          - uv tool install basedpyright
          - pipx install basedpyright
        - +command: pyright-langserver --stdio
          +install: npm install -g pyright
        - +command: pylsp
          +install: pip install python-lsp-server
      typescript:
        +extensions:
        - ts
        - tsx
        - js
        - jsx
        - mjs
        - cjs
        - mts
        - cts
        +open_first_file: true
        +servers:
        - +command: typescript-language-server --stdio
          +install:
          - brew install typescript-language-server
          - npm install -g typescript-language-server typescript
        - +command: vtsls --stdio
          +install: npm install -g @vtsls/language-server
      go:
        +extensions:
        - go
        +servers:
        - +command: gopls
          +install:
          - brew install gopls
          - go install golang.org/x/tools/gopls@latest
      rust:
        +extensions:
        - rs
        +servers:
        - +command: rust-analyzer
          +install:
          - brew install rust-analyzer
          - rustup component add rust-analyzer
      c:
        +extensions:
        - c
        - h
        - cc
        - cpp
        - cxx
        - hpp
        - hh
        - m
        - mm
        +open_first_file: true  # clangd only finds compile_commands.json from a file it has been told about
        +servers:
        - +command: clangd
          +install: brew install llvm
      lua:
        +extensions:
        - lua
        +servers:
        - +command: lua-language-server
          +install: brew install lua-language-server
      bash:
        +extensions:
        - sh
        - bash
        +servers:
        - +command: bash-language-server start
          +install:
          - brew install bash-language-server
          - npm install -g bash-language-server

  +shortcuts:
    # Workflow
    C-M-c:
      +command: WTCODE_TMUX_MODE=split-window wtcode
      +new_window: true
      +remain: false
      +tip: wtcode
    C-M-f:
      +tmux: |
        display-popup -E -d '#{pane_current_path}' -w 100% -h 60% -b rounded -T ' OPTMUX Find ' '"$OPTMUX_DIR/bin/optmux-find"'
      +tip: >
        find a file or a tag (ranked together, omni) or a line (git grep) to edit; C-M-f cycles them and it resumes where you left off
    C-M-g:
      +command: |
        base=$(git rev-parse --abbrev-ref origin/HEAD 2>/dev/null) || base=origin/main
        git diff --quiet "$base"... -- 2>/dev/null
        if [ $? -eq 1 ] && [ -z "$(git --no-optional-locks status --porcelain 2>/dev/null)" ]; then
          (sleep 0.5; tmux send-keys Enter '*' Enter) &
          "$OPTMUX_DIR/bin/optmux-env" lazygit --screen-mode normal branch
        else
          "$OPTMUX_DIR/bin/optmux-env" lazygit --screen-mode normal
        fi
      +tip: >
        lazygit, opened on files when there are uncommitted changes or the branch has no diff yet, else on this branch's commits
    C-M-d:
      +command: |
        "$OPTMUX_DIR/bin/optmux-env" optmux-diff-base
      +tip: clickable diff against the default branch (same as lazygit's C-g)
    C-M-s:
      +command: ""
      +tip: shell in same dir
    C-M-w:
      +command: |
        "$OPTMUX_DIR/bin/optmux-gh-open"
      +detached: true
      +new_window: true
      +tip: open PR (or repo) on GitHub
    C-M-x:
      +tmux: |
        display-popup -E -w 100% -h 60% -b rounded -T ' OPTMUX eXtract ' '"$OPTMUX_DIR/bin/optmux-extract"'
      +tip: same as C-t X, without the prefix (OPTMUX eXtract)
    C-M-h:
      +tmux: |
        display-popup -E -w 90% -h 90% -b rounded -T ' OPTMUX tips ' 'bash "$OPTMUX_DIR/tmux/tips.sh" --force --popup'
      +tip: tips (this screen)

    # Quick access (raw tmux actions)
    C-M-z:
      +tmux: resize-pane -Z
      +tip: quick toggle zoom
    "C-M-\\":
      +tmux: select-pane -l \; resize-pane -Z
      +tip: last pane + zoom
    C-M-o:
      +tmux: select-pane -t :.- \; resize-pane -Z
      +tip: prev pane + zoom

    # Reference (display-only, bound in tmux.conf or plugins)
    C-t C-t:
      +tip: last window
    C-t C-c:
      +tip: new window
    C-t C-d:
      +tip: detach
    C-t C-o:
      +tip: rotate panes forward
    C-t o:
      +tip: rotate panes backward
    C-t n:
      +tip: next window with bell
    C-t p:
      +tip: prev window with bell
    C-t w:
      +tip: list all windows (pick one to jump to)
    C-t z:
      +tip: toggle zoom
    "C-t `":
      +tip: kill session (confirm)
    C-t R:
      +tip: reload config
    C-t F:
      +tip: tmux-fingers (copy URLs/paths/hashes)
    X:
      +tmux: |
        display-popup -E -w 100% -h 60% -b rounded -T ' OPTMUX eXtract ' '"$OPTMUX_DIR/bin/optmux-extract"'
      +tip: >
        OPTMUX eXtract: lines, or colored spans mixed with URLs/paths/hashes/PR numbers/versions,
        to type or copy (C-M-x switches, C-y copies, C-f/C-g find or grep it in the project)
    C-t h/j/k/l:
      +tip: navigate panes
    C-t t:
      +tip: send prefix to nested TMUX
    C-t T:
      +tip: swap prefix (nested TMUX)

  +menu:
    +pane:
      - +key: w
        +title: New Window (C-t c)
        +new_window: true
      - separator
      - +key: f
        +title: Find (C-M-f)
        +tmux: |
          display-popup -E -d '#{pane_current_path}' -w 100% -h 60% -b rounded -T ' OPTMUX Find ' '"$OPTMUX_DIR/bin/optmux-find"'
      - +key: x
        +title: eXtract (C-M-x)
        +tmux: |
          display-popup -E -w 100% -h 60% -b rounded -T ' OPTMUX eXtract ' '"$OPTMUX_DIR/bin/optmux-extract"'
      - separator
      - "*"
    +window:
      - +key: b
        +title: "#{?monitor-bell,Disable,Enable} Bell Alert"
        +tmux: if-shell -F "#{monitor-bell}" "set -w monitor-bell off" "set -w monitor-bell on"
      - +key: q
        +title: "#{?#{>:#{monitor-silence},0},Disable,Enable} Silence Alert"
        +tmux: if-shell -F "#{>:#{monitor-silence},0}" "set -w monitor-silence 0" "set -w monitor-silence 15"
      - separator
      - +key: f
        +title: Find (C-M-f)
        +tmux: |
          display-popup -E -d '#{pane_current_path}' -w 100% -h 60% -b rounded -T ' OPTMUX Find ' '"$OPTMUX_DIR/bin/optmux-find"'
      - +key: x
        +title: eXtract (C-M-x)
        +tmux: |
          display-popup -E -w 100% -h 60% -b rounded -T ' OPTMUX eXtract ' '"$OPTMUX_DIR/bin/optmux-extract"'
      - separator
      - "*"
