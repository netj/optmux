#!/usr/bin/env -S uvx optmux
# send-keys + detached shortcuts — typed into the new window's shell.
# detached always opens a background window (the current window, zoom included,
# is left untouched); the keys target it via `:$`.
# Shell stays alive after the command exits, so the window remains open
# (no remain-on-error semantics for send-keys; use command type for that).
session_name: send-keys-detached
start_directory: .

optmux:
  shortcuts:

    # ── detached alone ─────────────────────────────────────────────────────────
    C-M-b:
      send-keys: gh browse .
      detached: true
    C-M-m:
      send-keys: uvx marimo edit
      detached: true

    # ── explicit new_window (redundant with detached, but harmless) ────────────
    C-M-d:
      send-keys: |-
        hi=$(ps -A -o %cpu=,pid=,command= | sort -rn | awk '$1>50')
        if [ -n "$hi" ]; then echo "High CPU:"; echo "$hi"; exit 1
        else echo "CPU OK"
        fi
      new_window: true
      detached: true
    C-M-e:
      send-keys: ${VISUAL:-${EDITOR:-vim}} README.md
      new_window: true
      detached: true

windows:
  - window_name: shell
    panes:
      - ""
