#!/usr/bin/env -S uvx optmux
# send-keys + detached shortcuts — typed into the new pane/window's shell.
# Pane: targets the just-created split pane via `:.+`.
# Window: targets the new window via `:$`.
# Shell stays alive after the command exits, so the pane/window remains open
# (no remain-on-error semantics for send-keys; use command type for that).
# float_window is not available here — no tmux target names a floating pane;
# see TROUBLESHOOTING-tmux-floating-panes.md.
session_name: send-keys-detached
start_directory: .

optmux:
  shortcuts:

    # ── split pane in the current window ───────────────────────────────────────
    C-M-b:
      send-keys: gh browse .
      detached: true
    C-M-m:
      send-keys: uvx marimo edit
      detached: true

    # ── new_window: runs off in its own window ─────────────────────────────────
    C-M-d:
      send-keys: |-
        hi=$(ps -A -o %cpu=,pid=,command= | sort -rn | awk '$1>50')
        if [ -n "$hi" ]; then echo "High CPU:"; echo "$hi"; exit 1
        else echo "CPU OK"
        fi
      new_window: true
      detached: true
    C-M-e:
      send-keys: ${VISUAL:-${EDITOR:-vim}} README.md
      new_window: true
      detached: true

windows:
  - window_name: shell
    panes:
      - ""
