bind -n C-M-s split-window -v -c '#{pane_current_path}' \; resize-pane -Z
bind -n C-M-c split-window -v -c '#{pane_current_path}' 'WTCODE_TMUX_MODE=new-window wtcode' \; resize-pane -Z
bind -n C-M-f split-window -v -c '#{pane_current_path}' '${VISUAL:-${EDITOR:-vim}} $(fzf || echo .)' \; resize-pane -Z
bind -n C-M-g split-window -v -c '#{pane_current_path}' 'lazygit' \; resize-pane -Z
bind -n C-M-h new-window -c '#{pane_current_path}' '_script=$(cat <<'\''EOC'\''
bash "$OPTMUX_DIR/tmux/tips.sh" --force
EOC
)
"$SHELL" -euc "$_script" || bash -c "echo; echo; read -p '\''[optmux] Exit status $?. Press Return/Enter to dismiss...'\''"'
