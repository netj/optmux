bind -n C-M-c new-window -c '#{pane_current_path}' 'WTCODE_TMUX_MODE=split-window wtcode'
bind -n C-M-f split-window -v -c '#{pane_current_path}' '${VISUAL:-${EDITOR:-vim}} $(fzf || echo .)' \; resize-pane -Z
bind -n C-M-g split-window -v -c '#{pane_current_path}' '(sleep 0.5; tmux send-keys Enter '\''*'\'' Enter) &
"$OPTMUX_DIR/bin/optmux-env" lazygit --screen-mode normal branch
' \; resize-pane -Z
bind -n C-M-d split-window -v -c '#{pane_current_path}' '"$OPTMUX_DIR/bin/optmux-env" optmux-diff-base
' \; resize-pane -Z
bind -n C-M-s split-window -v -c '#{pane_current_path}' \; resize-pane -Z
bind -n C-M-w new-window -d -c '#{pane_current_path}' '_script=$(cat <<'\''EOC'\''
"$OPTMUX_DIR/bin/optmux-gh-open"
EOC
)
"$SHELL" -euc "$_script" || bash -c "printf '\''\a'\''; echo; echo; read -p '\''[optmux] Exit status $?. Press Return/Enter to dismiss...'\''"'
bind -n C-M-x {
  if-shell "ps -t #{pane_tty} -o command= | grep -Eq '(^|/)claude( |$|/)'" {
    # run only in claude: a single C-c clears its prompt without the delays of M-Enter/Escape-based resets
    send-keys C-c
    send-keys BSpace "!"  # Backspace leaves any ! shell mode, then ! enters it fresh
  }
  # pick lines in screen order, duplicates and all (extrakto dedups and reorders)
  display-popup -E -w 100% -h 60% '"$OPTMUX_DIR/bin/optmux-pick-text" "#{pane_id}"'
}

bind -n C-M-h new-window -c '#{pane_current_path}' '_script=$(cat <<'\''EOC'\''
bash "$OPTMUX_DIR/tmux/tips.sh" --force
EOC
)
"$SHELL" -euc "$_script" || bash -c "echo; echo; read -p '\''[optmux] Exit status $?. Press Return/Enter to dismiss...'\''"'
bind -n C-M-z resize-pane -Z
bind -n C-M-\\ select-pane -l \; resize-pane -Z
bind -n C-M-o select-pane -t :.- \; resize-pane -Z
