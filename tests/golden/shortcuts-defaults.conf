bind -n C-M-c new-window -c '#{pane_current_path}' 'WTCODE_TMUX_MODE=split-window wtcode'
bind -n C-M-f display-popup -E -d '#{pane_current_path}' -w 100% -h 60% -b rounded -T ' optmux Find ' '"$OPTMUX_DIR/bin/optmux-find"'

bind -n C-M-g if-shell '"$OPTMUX_DIR/bin/optmux-split-fits" #{pane_id}' { split-window -v -b -c '#{pane_current_path}' '(sleep 0.5; tmux send-keys Enter '\''*'\'' Enter) &
"$OPTMUX_DIR/bin/optmux-env" lazygit --screen-mode normal branch
' } { split-window -f -v -b -c '#{pane_current_path}' '(sleep 0.5; tmux send-keys Enter '\''*'\'' Enter) &
"$OPTMUX_DIR/bin/optmux-env" lazygit --screen-mode normal branch
' } \; resize-pane -Z
bind -n C-M-d if-shell '"$OPTMUX_DIR/bin/optmux-split-fits" #{pane_id}' { split-window -v -b -c '#{pane_current_path}' '"$OPTMUX_DIR/bin/optmux-env" optmux-diff-base
' } { split-window -f -v -b -c '#{pane_current_path}' '"$OPTMUX_DIR/bin/optmux-env" optmux-diff-base
' } \; resize-pane -Z
bind -n C-M-s if-shell '"$OPTMUX_DIR/bin/optmux-split-fits" #{pane_id}' { split-window -v -b -c '#{pane_current_path}' } { split-window -f -v -b -c '#{pane_current_path}' } \; resize-pane -Z
bind -n C-M-w new-window -d -c '#{pane_current_path}' '_script=$(cat <<'\''EOC'\''
"$OPTMUX_DIR/bin/optmux-gh-open"
EOC
)
"$SHELL" -euc "$_script" || bash -c "printf '\''\a'\''; echo; echo; read -p '\''[optmux] Exit status $?. Press Return/Enter to dismiss...'\''"'
bind -n C-M-x display-popup -E -w 100% -h 60% -b rounded -T ' optmux eXtract ' '"$OPTMUX_DIR/bin/optmux-extract"'

bind -n C-M-h new-window -c '#{pane_current_path}' '_script=$(cat <<'\''EOC'\''
bash "$OPTMUX_DIR/tmux/tips.sh" --force
EOC
)
"$SHELL" -euc "$_script" || bash -c "echo; echo; read -p '\''[optmux] Exit status $?. Press Return/Enter to dismiss...'\''"'
bind -n C-M-z resize-pane -Z
bind -n C-M-\\ select-pane -l \; resize-pane -Z
bind -n C-M-o select-pane -t :.- \; resize-pane -Z
bind X display-popup -E -w 100% -h 60% -b rounded -T ' optmux eXtract ' '"$OPTMUX_DIR/bin/optmux-extract"'

